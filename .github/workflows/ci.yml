name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Every uv command must use the matrix Python. Without this, `uv run` follows
      # .python-version (3.12) and rebuilds the environment without the dev extras.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run python --version
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # Runs the reusable AgentRelay workflow on the committed example regression test, so the
  # action users call is exercised on every push.
  agentrelay-example:
    uses: ./.github/workflows/agentrelay-action.yml
    with:
      scenarios-path: examples/file_cleanup_agent/regression
      provider: fake
