name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Every uv command must use the matrix Python. Without this, `uv run` follows
      # .python-version (3.12) and rebuilds the environment without the dev extras.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run python --version
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # Runs the reusable AgentRelay workflow on the committed example regression test, so the
  # action users call is exercised on every push.
  agentrelay-example:
    uses: ./.github/workflows/agentrelay-action.yml
    with:
      scenarios-path: examples/file_cleanup_agent/regression
      provider: fake

  # RelayBench must stay offline and finish in under 3 minutes (BLUEPRINT M8).
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run python bench/run_bench.py --out "$RUNNER_TEMP/RESULTS.md" --json "$RUNNER_TEMP/results.json"
      - run: cat "$RUNNER_TEMP/RESULTS.md" >> "$GITHUB_STEP_SUMMARY"

  # The package builds cleanly and the README quickstart works as written, without an API key.
  package-and-quickstart:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check dist/*
      - run: uv sync --all-extras
      - run: uv run python -m examples.file_cleanup_agent.agent --provider fake --seed 2
      - run: uv run relay show last
      - run: >-
          uv run relay explain last --step auto
          --oracle examples/file_cleanup_agent/oracles.py:deletes_outside_tmp
          --provider fake --fake-rules examples/file_cleanup_agent/fake_rules.py --html
      - run: >-
          uv run relay emit-test last --step s0002 --out my_regressions
          --system-prompt examples.file_cleanup_agent.agent:SYSTEM_FIXED
      - run: AGENTRELAY_PROVIDER=fake uv run pytest my_regressions
      - run: uv run python -m examples.refund_agent.agent --provider fake --seed 7
      - run: uv run relay bisect last --oracle examples/refund_agent/oracles.py:wrong_refund
