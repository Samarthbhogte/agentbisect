[project]
name = "agentrelay"
version = "0.1.0"
description = "git bisect + delta debugging for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-socket>=0.7",
    "hypothesis>=6.100",
    "coverage>=7.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[project.scripts]
relay = "agentrelay.cli:app"

[project.entry-points.pytest11]
agentrelay = "agentrelay.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrelay"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Terminal output uses en dashes and × on purpose.
"src/agentrelay/cli.py" = ["RUF001"]
"src/agentrelay/report/*.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
files = ["src/agentrelay"]
mypy_path = "src"
warn_unused_configs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "agentrelay.algo.*",
    "agentrelay.stats.*",
    "agentrelay.context.*",
    "agentrelay.schema",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: needs real API keys and network; run with --live",
    "agentrelay: generated AgentRelay regression scenario",
]
