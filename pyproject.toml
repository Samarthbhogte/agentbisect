[project]
# The import name is `agentrelay` and the command is `relay`; the distribution is `agent-relay`
# because `agentrelay` is taken on PyPI by an unrelated project.
name = "agent-relay"
version = "0.1.0"
description = "git bisect + delta debugging for AI agents: find which step and which context caused a failure"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Samarth Bhogte" }]
keywords = ["llm", "agents", "debugging", "delta-debugging", "ddmin", "replay", "testing", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-socket>=0.7",
    "hypothesis>=6.100",
    "coverage>=7.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Samarthbhogte/agentrelay-"
Repository = "https://github.com/Samarthbhogte/agentrelay-"
Issues = "https://github.com/Samarthbhogte/agentrelay-/issues"
Documentation = "https://github.com/Samarthbhogte/agentrelay-/tree/main/docs"

[project.scripts]
relay = "agentrelay.cli:app"

[project.entry-points.pytest11]
agentrelay = "agentrelay.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrelay"]

[tool.hatch.build.targets.sdist]
# An explicit allowlist: only these paths ship, so local-only files can never leak into a release.
only-include = ["src/agentrelay", "tests", "examples", "bench", "docs", "README.md", "LICENSE",
                "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Terminal output uses en dashes and × on purpose.
"src/agentrelay/cli.py" = ["RUF001"]
"src/agentrelay/report/*.py" = ["RUF001"]
"bench/*.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
files = ["src/agentrelay"]
mypy_path = "src"
warn_unused_configs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "agentrelay.algo.*",
    "agentrelay.stats.*",
    "agentrelay.context.*",
    "agentrelay.schema",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: needs real API keys and network; run with --live",
    "agentrelay: generated AgentRelay regression scenario",
]
